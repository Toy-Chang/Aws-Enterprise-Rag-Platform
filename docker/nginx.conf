# Production server configuration for the frontend image: serves the built SPA and
# forwards the API to the backend service so that one origin serves both.
#
# The image copies this file to /etc/nginx/conf.d/default.conf, which the base image
# includes inside the http block. Everything below therefore has to be http-context or
# lower; main-context directives such as `pid` and `worker_processes` stay in the base
# image's nginx.conf.

# The backend reads an inbound X-Request-ID and generates one when none is sent, and both
# the dev server proxy and this config have to leave that header intact: the identifier is
# what ties an operator-visible error to a line in the backend log. Forwarding what the
# caller sent, and minting an equally shaped identifier otherwise, keeps one id for the
# whole request (nginx's own access log can be correlated with it too).
map $http_x_request_id $request_id_value {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # An upload limit has to exist in the proxy, but the application's own limit
    # (APP_MAX_UPLOAD_SIZE_BYTES, 10 MiB) has to be the one that decides: it answers with
    # the documented 413 envelope, while nginx would answer with an HTML error page and
    # hide the contract from the caller. This value is therefore above the application's.
    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # `any` covers a deployment where another proxy sits in front of this one.
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # --- upstream settings, inherited by every proxying location below -------------
    # `backend` is the compose service name and 8000 is the port the API listens on
    # inside its container. This is the deployment equivalent of the two proxy entries in
    # frontend/vite.config.ts, which point the dev server at 127.0.0.1:8000.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id_value;

    # A synchronous evaluation ingests up to 25 documents and asks up to 100 questions
    # before it answers, so a request can legitimately run for minutes. nginx's 60s
    # default read timeout would cut that off with a 504 while the backend was still
    # working, which looks like a failure of the platform rather than a slow request.
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # --- API ----------------------------------------------------------------------
    # proxy_pass without a URI part forwards the path unchanged, which is what the API
    # needs: it serves /api/v1/... itself, and the frontend calls relative paths so the
    # browser never makes a cross-origin request and the backend needs no CORS.
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # The two probes, matched exactly rather than as a /health prefix. That also keeps
    # /healthz (below) from ever being caught by a proxy rule, and makes a future
    # /health/<something> a deliberate addition instead of an accidental one.
    location = /health {
        proxy_pass http://backend:8000;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://backend:8000;
        access_log off;
    }

    # --- this container's own liveness ---------------------------------------------
    # Answered by nginx and not proxied on purpose: a backend outage has to leave the
    # frontend "healthy" (it is still serving the SPA), because restarting nginx would not
    # fix the API. Compose gates startup on the backend's own readiness probe instead.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- static assets --------------------------------------------------------------
    # Vite writes content-hashed names into assets/, so a year-long immutable cache can
    # never hand a browser a stale file: a changed file has a changed name. Only
    # Cache-Control is set -- `expires` would add a second Cache-Control header alongside
    # this one instead of replacing it.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell names the hashed assets, so a cached copy is exactly what pins a browser
    # to a build from before the last deploy. It is a few hundred bytes; not caching it
    # costs nothing.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routes (/knowledge-bases/{id}, and anything added later) are not files.
    # Falling back to the shell is what makes a deep link work; the internal redirect
    # re-enters this server, so the no-store rule above applies to the falling-back
    # response too. Everything else this location serves (the icon, the sample datasets
    # under public/) has no content hash in its name, so it is revalidated rather than
    # cached blind.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

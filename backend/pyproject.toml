[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-enterprise-rag-platform-backend"
version = "1.0.0"
description = "Cloud-native enterprise knowledge retrieval and RAG platform (backend service)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "structlog>=24.4,<26.0",
  "sqlalchemy>=2.0,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=6.0,<7.0",
]

[project.optional-dependencies]
# The AWS SDK and the OpenSearch client are only needed by the AWS adapters. Keeping them
# out of the base install is what lets the platform run locally without either.
aws = [
  "boto3>=1.35,<2.0",
  "opensearch-py>=2.7,<3.0",
]
# Verifying a Cognito token needs JWT parsing and RSA verification. Kept out of the base
# install for the same reason as the AWS SDK: a deployment that runs with
# APP_AUTH_BACKEND=none never imports it.
auth = [
  "pyjwt[crypto]>=2.8,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]
# The production stack points APP_DATABASE_URL at postgresql+psycopg://. The binary wheel
# bundles libpq, so the image needs neither a compiler nor PostgreSQL client libraries.
postgres = [
  "psycopg[binary]>=3.2,<4.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "httpx2>=2.13,<3.0",
  "ruff>=0.7,<1.0",
  "boto3>=1.35,<2.0",
  "opensearch-py>=2.7,<3.0",
  "pyjwt[crypto]>=2.8,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
